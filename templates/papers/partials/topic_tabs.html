{% if topics %}
<nav aria-label="Topic views"
     style="display:flex; gap:0.25rem; flex-wrap:wrap; margin-bottom:1.25rem;
            border-bottom:2px solid var(--pico-card-border-color); padding-bottom:0;">
    {% for t in topics %}
    <a href="/papers/{{ paper_id }}/topics/{{ t.id }}"
       style="padding:0.3rem 0.9rem; text-decoration:none; font-size:0.85rem;
              border-radius:0.3rem 0.3rem 0 0; display:inline-block; margin-bottom:-2px;
              {% if t.id == active_topic_id %}
              border:2px solid var(--pico-card-border-color); border-bottom:2px solid var(--pico-background-color);
              background:var(--pico-background-color); color:var(--pico-color); font-weight:600;
              {% else %}
              color:var(--pico-muted-color);
              {% endif %}">
        {{ t.name[:28] }}{% if t.name|length > 28 %}…{% endif %}
    </a>
    {% endfor %}
</nav>
{% endif %}
