<!-- Quill rich text editor for human note -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<div id="human-note-view">
    {% if note and note.human_note %}
    <div class="ql-snow"><div class="ql-editor" style="padding: 0; border: none;">{{ note.human_note | safe }}</div></div>
    {% else %}
    <p style="color: var(--pico-muted-color); font-style: italic;">No note yet.</p>
    {% endif %}
    <button class="outline secondary" style="font-size: 0.85rem; padding: 0.3rem 0.7rem; margin-top: 0.5rem;"
            onclick="document.getElementById('human-note-view').style.display='none';
                     document.getElementById('human-note-edit').style.display='block';">
        Edit Note
    </button>
</div>

<div id="human-note-edit" style="display: none;">
    <div id="quill-editor" style="min-height: 8rem; background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: 0.25rem;">
        {{ note.human_note | safe if note and note.human_note else '' }}
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem;">
        <button type="button" style="font-size: 0.85rem; padding: 0.3rem 0.7rem; width: auto;"
                onclick="saveHumanNote({{ paper_id }})">
            Save Note <span id="note-ind" class="htmx-indicator"><span class="spinner"></span></span>
        </button>
        <button type="button" class="outline secondary" style="font-size: 0.85rem; padding: 0.3rem 0.7rem; width: auto;"
                onclick="document.getElementById('human-note-view').style.display='';
                         document.getElementById('human-note-edit').style.display='none';">
            Cancel
        </button>
    </div>
</div>

<script>
(function() {
    // ---------- Singleton UI elements (survive htmx re-renders) ----------
    if (!document.getElementById('side-panel')) {
        document.body.insertAdjacentHTML('beforeend', [
            '<div id="side-panel">',
            '  <div id="side-panel-header">',
            '    <span id="side-panel-url" style="flex:1;font-size:0.75rem;color:var(--pico-muted-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>',
            '    <a id="side-panel-tab" href="#" target="_blank" rel="noopener"',
            '       style="font-size:0.8rem;white-space:nowrap;flex-shrink:0;">Open in tab ↗</a>',
            '    <button id="side-panel-close"',
            '            style="width:auto;margin:0;padding:0.1rem 0.5rem;font-size:1rem;background:none;border:none;cursor:pointer;flex-shrink:0;">✕</button>',
            '  </div>',
            '  <iframe id="side-panel-iframe" src="" title="Side view" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>',
            '</div>',
            '<div id="link-dialog-overlay">',
            '  <div style="background:var(--pico-card-background-color);padding:1.5rem;border-radius:0.5rem;min-width:22rem;max-width:90vw;">',
            '    <p style="margin:0 0 0.75rem 0;"><strong>Insert link</strong></p>',
            '    <input id="link-dialog-input" type="url" placeholder="https://…" style="margin-bottom:0.75rem;">',
            '    <div style="display:flex;gap:0.5rem;justify-content:flex-end;">',
            '      <button id="link-dialog-cancel" class="outline secondary" style="width:auto;margin:0;">Cancel</button>',
            '      <button id="link-dialog-confirm" style="width:auto;margin:0;">Insert</button>',
            '    </div>',
            '  </div>',
            '</div>',
            '<div id="quill-ctx-menu">',
            '  <button id="ctx-add-link">&#128279; Add link</button>',
            '</div>'
        ].join(''));

        // Close side panel
        document.getElementById('side-panel-close').addEventListener('click', function() {
            document.getElementById('side-panel').classList.remove('open');
            document.getElementById('side-panel-iframe').src = '';
        });

        // Close context menu on outside click
        document.addEventListener('click', function(e) {
            var menu = document.getElementById('quill-ctx-menu');
            if (menu && !menu.contains(e.target)) menu.style.display = 'none';
        });

        // Close link dialog on backdrop click
        document.getElementById('link-dialog-overlay').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('open');
        });

        // Link dialog cancel
        document.getElementById('link-dialog-cancel').addEventListener('click', function() {
            document.getElementById('link-dialog-overlay').classList.remove('open');
        });

        // "Add link" menu item — uses window._activeQuill set below
        document.getElementById('ctx-add-link').addEventListener('click', function() {
            document.getElementById('quill-ctx-menu').style.display = 'none';
            var dlg = document.getElementById('link-dialog-overlay');
            var input = document.getElementById('link-dialog-input');
            input.value = '';
            dlg.classList.add('open');
            setTimeout(function() { input.focus(); }, 50);

            function doInsert() {
                var url = input.value.trim();
                var q = window._activeQuill;
                var r = window._activeQuillRange;
                if (url && q && r) {
                    q.setSelection(r.index, r.length);
                    q.format('link', url);
                }
                dlg.classList.remove('open');
                cleanup();
            }
            function onKey(e) {
                if (e.key === 'Enter') doInsert();
                else if (e.key === 'Escape') { dlg.classList.remove('open'); cleanup(); }
            }
            function cleanup() {
                document.getElementById('link-dialog-confirm').removeEventListener('click', doInsert);
                input.removeEventListener('keydown', onKey);
            }
            document.getElementById('link-dialog-confirm').addEventListener('click', doInsert);
            input.addEventListener('keydown', onKey);
        });
    }

    function openSidePanel(url) {
        document.getElementById('side-panel-url').textContent = url;
        document.getElementById('side-panel-tab').href = url;
        document.getElementById('side-panel-iframe').src = url;
        document.getElementById('side-panel').classList.add('open');
    }

    // ---------- Quill setup ----------
    var quill = new Quill('#quill-editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                ['image', 'link'],
                ['clean']
            ]
        },
        placeholder: 'What do you find important or unimportant about this paper? Your notes will inform topic steering.'
    });

    // Always expose the active quill instance for singleton handlers
    window._activeQuill = quill;

    // Context menu on right-click with selection
    quill.root.addEventListener('contextmenu', function(e) {
        var sel = quill.getSelection();
        if (sel && sel.length > 0) {
            e.preventDefault();
            e.stopPropagation();
            window._activeQuillRange = sel;
            var menu = document.getElementById('quill-ctx-menu');
            var x = e.clientX, y = e.clientY;
            menu.style.display = 'block';
            if (x + menu.offsetWidth > window.innerWidth - 8) x = window.innerWidth - menu.offsetWidth - 8;
            if (y + menu.offsetHeight > window.innerHeight - 8) y = window.innerHeight - menu.offsetHeight - 8;
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        }
    });

    // Paste screenshot support
    quill.root.addEventListener('paste', function(e) {
        var items = (e.clipboardData || window.clipboardData).items;
        for (var i = 0; i < items.length; i++) {
            if (items[i].type.startsWith('image/')) {
                e.preventDefault();
                var file = items[i].getAsFile();
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var range = quill.getSelection(true);
                    quill.insertEmbed(range.index, 'image', ev.target.result);
                };
                reader.readAsDataURL(file);
                break;
            }
        }
    });

    // ---------- View mode link clicks → side panel ----------
    document.getElementById('human-note-view').addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (a) {
            e.preventDefault();
            openSidePanel(a.getAttribute('href'));
        }
    });

    window.saveHumanNote = function(paperId) {
        var html = quill.root.innerHTML;
        if (html === '<p><br></p>') html = '';
        fetch('/papers/' + paperId + '/human-note', {
            method: 'PUT',
            headers: {'Content-Type': 'application/x-www-form-urlencoded', 'HX-Request': 'true'},
            body: 'human_note=' + encodeURIComponent(html)
        }).then(function(r) {
            return r.text();
        }).then(function(html) {
            document.getElementById('human-note-section').innerHTML = html;
            htmx.process(document.getElementById('human-note-section'));
        });
    };
})();
</script>
