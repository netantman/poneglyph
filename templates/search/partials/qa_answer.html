<div id="qa-answer-area" style="margin-top:1.5rem;">
    <article style="margin:0; padding:1rem 1.25rem;">
        <header style="margin-bottom:0.75rem; padding-bottom:0.6rem;
                       border-bottom:1px solid var(--pico-card-border-color);">
            <strong style="font-size:0.95rem;">Answer</strong>
            <span style="font-size:0.82rem; color:var(--pico-muted-color);
                         font-weight:normal; margin-left:0.6rem;">
                for: <em>{{ question }}</em>
            </span>
        </header>
        <div class="skill-md" data-md="{{ answer_md | e }}"></div>
    </article>
</div>
